name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: bash scripts/build-release.sh
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/install.sh
            dist/SHA256SUMS
            dist/wsproxy-linux-amd64.tar.gz
            dist/wsproxy-linux-arm64.tar.gz
            dist/wsproxy-darwin-amd64.tar.gz
            dist/wsproxy-darwin-arm64.tar.gz
