<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wsproxy</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0b0d10; color: #e8eaed; font-family: sans-serif; }
    form { max-width: 22rem; margin: 12vh auto; padding: 0 1.5rem; }
    h1 { font-size: 1.2rem; font-weight: 600; }
    input, button { width: 100%; box-sizing: border-box; margin: .4rem 0; padding: .6rem .7rem; border-radius: 6px; border: 1px solid #3c4043; }
    input { background: #15181d; color: inherit; }
    button { background: #8ab4f8; color: #0b0d10; border: 0; font-weight: 600; cursor: pointer; }
    .err { color: #f28b82; font-size: .9rem; }
  </style>
</head>
<body>
  <form method="post" action="/">
    <h1>输入访问 token</h1>
    {{ERR}}
    <input type="password" name="token" autocomplete="current-password" autofocus />
    <button type="submit">进入</button>
  </form>
</body>
</html>
